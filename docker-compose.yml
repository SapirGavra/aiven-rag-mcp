services:
  server:
    build: .
    image: aiven-rag-mcp:dev
    stdin_open: true
    environment:
      DATABASE_URL: postgresql://rag:rag_local_dev@db:5432/rag
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.cache/models:/app/.cache/models:ro
      - ./documents:/app/documents:ro
      - ./data:/app/data:ro
      - ./data/reports:/app/data/reports

  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/002-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
